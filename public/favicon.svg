<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" fill="#FF6B00"/>
  
  <!-- Building Structure -->
  <g transform="translate(140, 140)">
    <!-- Main Building -->
    <rect x="40" y="80" width="120" height="160" fill="white" opacity="0.95"/>
    
    <!-- Windows -->
    <rect x="55" y="95" width="20" height="20" fill="#FF6B00"/>
    <rect x="85" y="95" width="20" height="20" fill="#FF6B00"/>
    <rect x="115" y="95" width="20" height="20" fill="#FF6B00"/>
    
    <rect x="55" y="125" width="20" height="20" fill="#FF6B00"/>
    <rect x="85" y="125" width="20" height="20" fill="#FF6B00"/>
    <rect x="115" y="125" width="20" height="20" fill="#FF6B00"/>
    
    <rect x="55" y="155" width="20" height="20" fill="#FF6B00"/>
    <rect x="85" y="155" width="20" height="20" fill="#FF6B00"/>
    <rect x="115" y="155" width="20" height="20" fill="#FF6B00"/>
    
    <rect x="55" y="185" width="20" height="20" fill="#FF6B00"/>
    <rect x="85" y="185" width="20" height="20" fill="#FF6B00"/>
    <rect x="115" y="185" width="20" height="20" fill="#FF6B00"/>
    
    <!-- Door -->
    <rect x="85" y="210" width="30" height="30" fill="#003DA5"/>
    
    <!-- Roof -->
    <path d="M 30 80 L 100 40 L 170 80 Z" fill="white" opacity="0.95"/>
    
    <!-- AI Neural Network Overlay -->
    <!-- Nodes -->
    <circle cx="20" cy="60" r="8" fill="white" opacity="0.9"/>
    <circle cx="180" cy="60" r="8" fill="white" opacity="0.9"/>
    <circle cx="20" cy="180" r="8" fill="white" opacity="0.9"/>
    <circle cx="180" cy="180" r="8" fill="white" opacity="0.9"/>
    <circle cx="100" cy="30" r="10" fill="#003DA5" opacity="0.9"/>
    
    <!-- Connections -->
    <line x1="20" y1="60" x2="100" y2="30" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="180" y1="60" x2="100" y2="30" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="20" y1="180" x2="100" y2="30" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="180" y1="180" x2="100" y2="30" stroke="white" stroke-width="3" opacity="0.6"/>
    
    <!-- AI Sparkle -->
    <g transform="translate(160, 200)">
      <path d="M 0 -15 L 3 -3 L 15 0 L 3 3 L 0 15 L -3 3 L -15 0 L -3 -3 Z" fill="white" opacity="0.9"/>
    </g>
  </g>
</svg>

